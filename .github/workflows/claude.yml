# Interactive Claude, summoned by name.
#
# Comment "@claude <ask>" on any issue or PR (the GitHub mobile app counts, which
# is the entire point) and an agent picks it up, does the work on a branch, and
# opens or updates a PR. This is the phone-first half of the setup: the ask costs
# one thumb-typed sentence, the review comes back as a normal PR.
#
# It deliberately does NOT run on every comment. The `if` guard below checks for
# the trigger phrase before the runner even boots, so ordinary conversation on a
# PR is free. This repo is public, so runner minutes are free either way, but the
# Anthropic tokens are not, and an agent that wakes up on every "lgtm" burns them.
#
# Model is left unpinned here on purpose. This path is invoked deliberately by a
# human, so it should get the strong default. The automatic gate in
# ship-gate.yml is the one that runs constantly and is pinned down to Sonnet.

name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]

concurrency:
  # One agent per issue/PR thread. A second @claude while the first is still
  # working queues instead of racing it into the same branch.
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Cheap pre-flight: only boot a runner if someone actually said @claude.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || github.event.label.name == 'claude'))
    runs-on: ubuntu-latest
    # A real feature takes a while. 30 is generous without letting a wedged run
    # bill forever.
    timeout-minutes: 30
    permissions:
      contents: write # push the working branch
      pull-requests: write # open/update the PR, comment
      issues: write # comment back on issues
      id-token: write # OIDC, required by the action

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the agent can diff against master

      # The repo maintains pnpm-lock.yaml, not package-lock.json: every dependency
      # added since 2026-08-14 landed in the pnpm lock only. CI installs from the
      # lockfile that is actually kept current, so a new dependency can never
      # silently take the runners down again.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Pre-install so the agent spends its turns on the task, not on `npm ci`.
      - run: pnpm install --frozen-lockfile

      - uses: anthropics/claude-code-action@v1
        with:
          # SUBSCRIPTION, NOT THE METERED API. An @claude mention starts a
          # 30-minute agentic run with Write and Edit on the strong default
          # model, which is the single most expensive thing this repo can do on
          # purpose. On the API key that was billed against the credit wallet;
          # on an OAuth token from `claude setup-token` it rides the Max plan
          # and costs nothing, which is the same plan the local agents already
          # use for the same work.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Collapse the running commentary into one comment instead of a dozen.
          use_sticky_comment: true
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Grep,Glob,Task,WebFetch"
            --max-turns 40
