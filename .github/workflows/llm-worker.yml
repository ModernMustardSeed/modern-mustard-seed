# The always-on half of the subscription.
#
# `scripts/llm-worker.mjs` on Sarah's workstation answers queued prompts in
# under a second, but only while that machine is awake. This runs the same
# worker in a runner every five minutes, authenticated with a Claude Code OAuth
# token instead of an API key, so the queue still drains overnight, on weekends,
# and while the laptop is in a bag.
#
# WHY THIS IS NOT AN API KEY. `claude setup-token` mints a subscription token
# and the CLI reads CLAUDE_CODE_OAUTH_TOKEN directly. So this job is Sarah's Max
# plan doing the work, not the metered wallet. That is the entire point of the
# migration this file is part of: there is no Anthropic API key left in this
# repo, and adding one back here would quietly undo all of it.
#
# The repo is public, so runner minutes are free. The job no-ops in a few
# seconds when the queue is empty, which is most of the time.

name: llm-worker

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes (best-effort on GitHub)
  workflow_dispatch: {}

concurrency:
  # One drainer at a time from Actions. The claim function is safe against
  # concurrent workers, but there is no reason to pay for the contention.
  group: llm-worker
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    # The worker gives itself a 12-minute budget; 20 leaves room for install and
    # for one long job to finish rather than being killed mid-answer.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The repo maintains pnpm-lock.yaml, not package-lock.json: every dependency
      # added since 2026-08-14 landed in the pnpm lock only. CI installs from the
      # lockfile that is actually kept current, so a new dependency can never
      # silently take the runners down again.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          # 24 for native TS type-stripping: the worker imports
          # lib/claude-code-json.ts directly, so the engine stays in one
          # typechecked place instead of being duplicated in JS.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code

      - name: Drain the queue
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/llm-worker.mjs --drain
