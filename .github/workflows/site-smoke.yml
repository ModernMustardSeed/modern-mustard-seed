# The site smoke check: after every production deploy, and every half hour.
#
# All the logic lives server-side in app/api/cron/site-smoke/route.ts (homepage,
# /demos, /kingdom, the build ask endpoint, and a real demo website rendering in
# our own frame). It emails Sarah on failure and returns 500, so a red run shows
# here too. It never creates a lead or sends a customer anything.
#
# Why this exists: on 2026-09-23 two breaks were found by hand that had been
# live for days (the build ask timing out, and every demo site refusing to load).

name: site-smoke

on:
  deployment_status:
  schedule:
    - cron: "12,42 * * * *" # every half hour, off the top of the hour
  workflow_dispatch:
    inputs:
      selftest:
        description: "Fire a synthetic failure to test the alert email"
        type: boolean
        default: false

concurrency:
  group: site-smoke
  cancel-in-progress: false

jobs:
  smoke:
    # On a deploy event, only a finished PRODUCTION deploy. Scheduled and manual runs always go.
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run the site smoke check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SELFTEST: ${{ github.event.inputs.selftest }}
        run: |
          URL="https://modernmustardseed.com/api/cron/site-smoke"
          if [ "$SELFTEST" = "true" ]; then URL="$URL?selftest=1"; fi
          BODY=$(curl -sS -m 90 -w $'\n%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$URL")
          CODE=$(printf '%s' "$BODY" | tail -n1)
          echo "HTTP $CODE"
          printf '%s' "$BODY" | sed '$d'
          echo
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "::error::A site smoke check failed. Sarah has been emailed."
            exit 1
          fi
