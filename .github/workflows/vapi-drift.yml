name: Vapi drift check

# Catches the failure this whole system exists to prevent: someone edits an
# assistant in the Vapi dashboard, the repo silently stops matching production,
# and nobody finds out until a client's agent behaves in a way no commit
# explains. Runs daily and on any change to the configs or the sync tooling.
on:
  schedule:
    - cron: '0 15 * * *' # 08:00 Mountain, daily
  pull_request:
    paths:
      - 'vapi/assistants/**'
      - 'scripts/vapi-sync.mjs'
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Needs no credentials, so it runs first and fails fast. Catches an agent
      # cloned from the wrong vertical (the failure that shipped a med spa whose
      # booking tool asks for paint colors) before any network call happens.
      - name: Lint the fleet against vapi/fleet.json
        run: node scripts/vapi-lint.mjs

      # Exits 1 when repo and Vapi disagree, which fails the job. On a pull
      # request that is the point: a config change must be pushed to Vapi, or
      # the PR is describing a state that does not exist.
      - name: Compare repo configs against live Vapi
        env:
          VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
        run: node scripts/vapi-sync.mjs --diff

      # A VALID CONFIG IS NOT A WORKING TOOL. Everything above this line was
      # green for the eleven days `forge_demo_suite` sent the webhook nothing but
      # `{}` on every real call, because a tool schema that the model cannot fill
      # is not drift and is not a lint error: it PATCHes clean, stores clean and
      # reads back clean. The only place that failure is visible is in the
      # arguments the model actually sent, so this reads them.
      - name: Fail if a tool with required arguments came back empty
        if: always()
        env:
          VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
        run: node scripts/vapi-tool-health.mjs --days 30

      # Separate step so an unprotected webhook is its own red X in the run log
      # rather than a line buried in the inventory output.
      - name: Fail if any webhook is unprotected
        if: always()
        env:
          VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
        run: |
          node scripts/vapi-assistants.mjs > inventory.txt
          cat inventory.txt
          if grep -q 'UNPROTECTED WEBHOOK' inventory.txt; then
            echo "::error::One or more Vapi webhooks have no secret set. Anyone who learns the URL can POST built tool calls."
            exit 1
          fi
